<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Converter</title>
<meta name="description" content="浏览器里运行的视频转换器：导入 B 站 m4s 自动合并音视频，原质量无损转换，支持批量转换与自选输出文件夹。">
<script>
/* 主题要在 CSS 生效前定好，否则会先画一帧深色再跳浅色。
   与宣传页共用同一个 localStorage key（vc2_theme），两边外观保持一致。 */
(function(){
  var pref = 'auto';
  try{ var s = localStorage.getItem('vc2_theme'); if(s === 'light' || s === 'dark' || s === 'auto') pref = s; }catch(_){}
  var dark = pref === 'dark' || (pref === 'auto' &&
    !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches));
  var el = document.documentElement;
  el.setAttribute('data-theme-pref', pref);
  el.setAttribute('data-theme', dark ? 'dark' : 'light');
  el.style.colorScheme = dark ? 'dark' : 'light';
})();
/* 关掉 Netlify 自己注入的 "Powered by Netlify" 浮层。
   它是 Netlify 的 HUD：一个 position:fixed 的 iframe，钉死在右下角
   （bottom:0; right:0; z-index:2147483645），会盖住底部的操作按钮；
   它的样式里没有任何拖动逻辑，位置是写死的，所以只能关掉、挪不走。

   机制：HUD 脚本启动时读本站 localStorage 的 nl-hud:<variant>:v1，
   若为 "hidden" 就直接 return，连 iframe 都不创建。HUD 自己那个
   「隐藏」按钮走 postMessage 写的也是同一个 key。
   跨域限制：我们改不了 iframe 里的内容，但能写自己站的 localStorage，
   所以在这里同步写好标记，让徽章来不及渲染。
   用 try/catch 包住：隐私模式下 localStorage 不可写，不能因此弄坏页面。 */
try{
  localStorage.setItem('nl-hud:public:v1', 'hidden');        // 公开访客看到的徽章
  localStorage.setItem('nl-hud:owner-private:v1', 'hidden'); // 站点所有者自己访问时的工具条
}catch(_){}
</script>
<style>
  /* 主题令牌。深色是默认外观（保持这个工具原本的样子），
     [data-theme="light"] 覆盖同名令牌。两套 key 必须完全一致。 */
  :root{
    --radius:12px;
  }
  :root, :root[data-theme="dark"]{
    --bg:#0e1116;
    --bg2:#141922;
    --card:#181e28;
    --card2:#1e2530;
    --line:#262e3b;
    --text:#e8ecf3;
    --text2:#9aa6b8;
    --text3:#8290a4;
    --accent:#00a1d6;
    --accent2:#fb7299;
    --ok:#2fbf71;
    --warn:#e8a33d;
    --err:#e8574a;
    /* 下面这组是原先散在规则里的硬编码色，抽出来才能跟着主题走 */
    --accent-deep:#0088bb;
    --accent2-deep:#e05a85;
    --on-accent:#fff;
    --line-hover:#35415a;
    --track:#232b38;
    --scroll:#2b3442;
    --scroll-hover:#3a4557;
    --shadow-seg:0 1px 3px rgba(0,0,0,.3);
    --shadow-card:0 8px 22px rgba(0,0,0,.34);
    --shadow-drawer:-14px 0 40px rgba(0,0,0,.45);
    --shadow-fab:0 8px 24px rgba(0,0,0,.4);
    --shadow-ov:0 24px 60px rgba(0,0,0,.5);
    --shadow-toast:0 10px 30px rgba(0,0,0,.45);
    --overlay:rgba(9,11,15,.72);
    --shot-bg:rgba(0,0,0,.72);
    --shot-ring:rgba(255,255,255,.55);
    --tag-single-bg:rgba(251,114,153,.14);
    --tag-single-fg:#f79ab5;
    --ok-flat:var(--ok-flat);
    --err-flat:var(--err-flat);
    --warn-flat:var(--warn-flat);
    --warn-line:var(--warn-line);
    --warn-soft:var(--warn-soft);
    --muted-flat:var(--muted-flat);
    --accent-strong:var(--accent-strong);
    --accent-14:var(--accent-14);
    --accent-09:var(--accent-09);
    --accent-05:var(--accent-05);
    --blur-bg:rgba(0,0,0,.5);
    --line-btn:var(--line-hover);
    --switch-off:#2c3644;
    --switch-knob:#8b97a8;
    --dash-fg:#4cc5ea;
    --ok-fg:#8fe3b6;
    color-scheme:dark;
  }
  :root[data-theme="light"]{
    --bg:#f7f8fa;
    --bg2:#ffffff;
    --card:#ffffff;
    --card2:#eef1f5;
    --line:#e2e6ec;
    --text:#1a1f28;
    --text2:#545e6e;
    --text3:#636d79;
    --accent:#087096;
    --accent2:#c73f69;
    --ok:#1c7f4b;
    --warn:#9c6a15;
    --err:#c2382c;
    --accent-deep:#076084;
    --accent2-deep:#b23a60;
    --on-accent:#fff;
    --line-hover:#c3cbd8;
    --track:#e2e6ec;
    --scroll:#c8cfda;
    --scroll-hover:#aeb7c5;
    --shadow-seg:0 1px 3px rgba(20,30,50,.12);
    --shadow-card:0 8px 22px rgba(20,30,50,.1);
    --shadow-drawer:-14px 0 40px rgba(20,30,50,.14);
    --shadow-fab:0 8px 24px rgba(20,30,50,.16);
    --shadow-ov:0 24px 60px rgba(20,30,50,.22);
    --shadow-toast:0 10px 30px rgba(20,30,50,.16);
    --overlay:rgba(20,28,40,.5);
    --shot-bg:rgba(20,28,40,.66);
    --shot-ring:rgba(255,255,255,.7);
    --tag-single-bg:rgba(199,63,105,.1);
    --tag-single-fg:#b23a60;
    --ok-flat:rgba(28,127,75,.92);
    --err-flat:rgba(194,56,44,.94);
    --warn-flat:rgba(156,106,21,.94);
    --warn-line:rgba(156,106,21,.32);
    --warn-soft:rgba(156,106,21,.1);
    --muted-flat:rgba(92,102,118,.92);
    --accent-strong:rgba(8,112,150,.9);
    --accent-14:rgba(8,112,150,.12);
    --accent-09:rgba(8,112,150,.08);
    --accent-05:rgba(8,112,150,.04);
    --blur-bg:rgba(255,255,255,.5);
    --line-btn:#c3cbd8;
    --switch-off:#d3d9e2;
    --switch-knob:#8b97a8;
    --dash-fg:#087096;
    --ok-fg:#1c7f4b;
    color-scheme:light;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:13px}
  input,select{font-family:inherit;font-size:13px}
  a{color:var(--accent);text-decoration:none}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:6px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:var(--scroll-hover)}
  ::-webkit-scrollbar-track{background:transparent}
  .hidden{display:none!important}

  .app{display:flex;flex-direction:column;height:100vh}

  /* 顶栏 */
  header{
    display:flex;align-items:center;gap:14px;padding:13px 22px;
    background:var(--bg2);border-bottom:1px solid var(--line);flex-shrink:0;flex-wrap:wrap;
  }
  .logo{display:flex;align-items:center;gap:9px;font-weight:650;font-size:16px;letter-spacing:.2px;white-space:nowrap}
  .logo .dot{width:10px;height:10px;border-radius:3px;background:linear-gradient(135deg,var(--accent),var(--accent2))}
  .logo .name-i{background:linear-gradient(120deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .importbox{
    display:flex;align-items:center;gap:6px;
    background:var(--card);border:1px solid var(--line);border-radius:9px;padding:4px 6px;
  }
  .importbox .btn{padding:6px 12px;background:transparent;border-color:transparent}
  .importbox .btn:hover{background:var(--card2);border-color:var(--line)}
  .importbox .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-deep));border-color:transparent;color:var(--on-accent)}
  .importbox .btn.primary:hover{filter:brightness(1.12);background:linear-gradient(135deg,var(--accent),var(--accent-deep))}
  .stats{display:flex;gap:8px;flex-shrink:0;margin-left:auto}
  .chip{
    display:flex;flex-direction:column;align-items:center;padding:5px 14px;border-radius:9px;
    background:var(--card);border:1px solid var(--line);min-width:74px;
  }
  .chip b{font-size:15px;font-weight:650;line-height:1.2}
  .chip i{font-style:normal;font-size:10.5px;color:var(--text3);letter-spacing:.3px}
  .chip.done b{color:var(--ok)}
  .chip.pending b{color:var(--warn)}

  /* 工具条 */
  .toolbar{
    display:flex;align-items:center;gap:12px;padding:11px 22px;background:var(--bg);
    border-bottom:1px solid var(--line);flex-shrink:0;flex-wrap:wrap;
  }
  .search{position:relative;flex:1;min-width:170px;max-width:330px}
  .search input{
    width:100%;background:var(--card);border:1px solid var(--line);border-radius:9px;
    padding:8px 12px 8px 32px;color:var(--text);outline:none;
  }
  .search input:focus{border-color:var(--accent)}
  .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.5}
  .tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
  .tabs button{padding:6px 14px;border-radius:7px;color:var(--text2);font-weight:500;transition:.15s}
  .tabs button:hover{color:var(--text)}
  .tabs button.on{background:var(--card2);color:var(--text);box-shadow:var(--shadow-seg)}
  .tabs button.on[data-f="pending"]{color:var(--warn)}
  .tabs button.on[data-f="done"]{color:var(--ok)}
  .toolbar select{
    background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;color:var(--text);outline:none;cursor:pointer;
  }
  .spacer{flex:1}
  .btn{
    display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:9px;
    background:var(--card);border:1px solid var(--line);font-weight:500;transition:.15s;white-space:nowrap;
  }
  .btn:hover{background:var(--card2);border-color:var(--line-btn)}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-deep));border-color:transparent;color:var(--on-accent);font-weight:600}
  .btn.primary:hover{filter:brightness(1.12)}
  .btn.pink{background:linear-gradient(135deg,var(--accent2),var(--accent2-deep));border-color:transparent;color:var(--on-accent);font-weight:600}
  .btn.pink:hover{filter:brightness(1.12)}
  .btn:disabled{opacity:.42;cursor:not-allowed;filter:none!important}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--text2)}
  .btn.ghost:hover{background:var(--card);color:var(--text)}
  .langbtn{
    padding:6px 13px;font-weight:650;letter-spacing:.3px;min-width:56px;justify-content:center;
    background:var(--card);border-color:var(--line);color:var(--text);
  }
  .langbtn:hover{border-color:var(--accent);color:var(--accent)}

  /* 外观切换按钮：与语言按钮同高，只放图标，按 data-theme-pref 显示其一 */
  .iconbtn{
    width:32px;height:32px;padding:0;display:inline-grid;place-items:center;
    background:var(--card);border:1px solid var(--line);color:var(--text2);flex:0 0 auto;
  }
  .iconbtn:hover{border-color:var(--accent);color:var(--accent)}
  .iconbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;display:none}
  :root[data-theme-pref="auto"]  #btnTheme .i-auto,
  :root[data-theme-pref="light"] #btnTheme .i-sun,
  :root[data-theme-pref="dark"]  #btnTheme .i-moon{display:block}

  /* 选项条 */
  .options{
    display:flex;align-items:center;gap:20px;padding:10px 22px;background:var(--bg2);
    border-bottom:1px solid var(--line);font-size:12.5px;color:var(--text2);flex-shrink:0;flex-wrap:wrap;
  }
  .opt{display:flex;align-items:center;gap:8px}
  .outpath{font-size:12px;color:var(--text2);background:var(--card);border:1px solid var(--line);border-radius:7px;padding:5px 10px;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .outpath.unset{color:var(--text3);font-style:italic}
  .switch{position:relative;width:36px;height:20px;border-radius:20px;background:var(--switch-off);transition:.2s;flex-shrink:0;cursor:pointer}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--switch-knob);transition:.2s}
  .switch.on{background:var(--accent2)}
  .switch.on::after{left:18px;background:var(--on-accent)}
  .switch.dis{opacity:.4;cursor:not-allowed}

  /* 主体 */
  main{flex:1;overflow-y:auto;padding:18px 22px 24px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:15px}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;transition:.16s;cursor:pointer;position:relative;
  }
  .card:hover{border-color:var(--line-hover);transform:translateY(-2px);box-shadow:var(--shadow-card)}
  .card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .thumb{position:relative;aspect-ratio:16/9;background:var(--card2);overflow:hidden}
  .thumb .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:11px}
  .thumb img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block;transition:.3s}
  .card:hover .thumb img{transform:scale(1.045)}
  .badge{
    position:absolute;padding:2px 7px;border-radius:5px;font-size:11px;font-weight:600;z-index:2;
    background:var(--shot-bg);backdrop-filter:blur(4px);color:var(--on-accent);
  }
  .badge.q{top:8px;left:8px;background:var(--accent-strong)}
  .badge.dur{bottom:8px;right:8px}
  .badge.state{top:8px;right:8px}
  .badge.state.done{background:var(--ok-flat)}
  .badge.state.run{background:var(--warn-flat)}
  .badge.state.err{background:var(--err-flat)}
  .badge.state.canceled{background:var(--muted-flat)}
  .check{
    position:absolute;bottom:8px;left:8px;width:22px;height:22px;border-radius:6px;z-index:3;
    background:var(--blur-bg);border:1.5px solid var(--shot-ring);
    display:flex;align-items:center;justify-content:center;transition:.15s;opacity:0;
  }
  .card:hover .check,.card.sel .check,.card.hasstate .check{opacity:1}
  .card.sel .check{background:var(--accent);border-color:var(--accent)}
  .check svg{opacity:0}
  .card.sel .check svg{opacity:1}

  .meta{padding:11px 12px 12px}
  .meta .title{
    font-size:13px;font-weight:550;line-height:1.45;height:2.9em;overflow:hidden;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  }
  .meta .sub{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:11.5px;color:var(--text3);gap:8px}
  .meta .sub .u{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta .sub .s{white-space:nowrap}
  .meta .tagwrap{margin-top:7px}
  .meta .tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:5px}
  .meta .tag.dash{background:var(--accent-14);color:var(--dash-fg)}
  .meta .tag.single{background:var(--tag-single-bg);color:var(--tag-single-fg)}
  .pbar{height:3px;background:var(--track);border-radius:3px;margin-top:9px;overflow:hidden;display:none}
  .card.running .pbar{display:block}
  .pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}

  /* 空状态 / 拖放区 */
  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:56vh;color:var(--text3);gap:10px;text-align:center}
  .empty b{color:var(--text2);font-weight:500;font-size:15px}
  .dropbig{
    width:min(680px,94%);margin-top:12px;border:1.6px dashed var(--line);border-radius:14px;
    padding:30px 24px;background:linear-gradient(180deg,var(--accent-05),transparent);transition:.18s;
  }
  .dropbig.over{border-color:var(--accent);background:var(--accent-09)}
  .dropbig .di{width:52px;height:52px;margin:0 auto 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--accent)}
  .dropbig .dt{font-weight:600;font-size:15px;color:var(--text)}
  .dropbig .ds{font-size:12.5px;color:var(--text3);margin-top:6px;line-height:1.7}
  .dropacts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}

  /* 底栏 */
  .actionbar{
    display:flex;align-items:center;gap:10px;padding:12px 22px;background:var(--bg2);
    border-top:1px solid var(--line);flex-shrink:0;flex-wrap:wrap;
  }
  .selinfo{color:var(--text2);font-size:13px;margin-left:4px}
  .selinfo b{color:var(--accent);font-weight:650}
  .warnbar{
    background:var(--warn-soft);border-bottom:1px solid var(--warn-line);color:var(--warn);
    padding:8px 22px;font-size:12.5px;flex-shrink:0;display:none;
  }

  /* 进度抽屉 */
  .drawer{
    position:fixed;right:0;top:0;height:100vh;width:400px;max-width:92vw;background:var(--bg2);
    border-left:1px solid var(--line);transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;z-index:50;box-shadow:var(--shadow-drawer);
  }
  .drawer.open{transform:translateX(0)}
  .drawer header{border-bottom:1px solid var(--line);background:transparent;padding:15px 18px}
  .drawer .dtitle{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
  .drawer .dbody{flex:1;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:10px}
  .job{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
  .job .jt{font-size:12.5px;line-height:1.4;height:2.8em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin-bottom:8px}
  .job .jrow{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--text3);margin-bottom:6px}
  .job .jbar{height:5px;background:var(--track);border-radius:4px;overflow:hidden}
  .job .jbar i{display:block;height:100%;width:0;transition:width .3s;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .job.done .jbar i{background:var(--ok)}
  .job.error .jbar i{background:var(--err)}
  .job .jmsg{font-size:11.5px;color:var(--err);margin-top:7px;word-break:break-all}
  .job.done .jt{color:var(--text2)}

  .fab{
    position:fixed;right:20px;bottom:76px;z-index:40;display:none;align-items:center;gap:8px;
    padding:11px 16px;border-radius:24px;background:var(--card2);border:1px solid var(--line);
    box-shadow:var(--shadow-fab);font-weight:550;transition:.15s;
  }
  .fab.show{display:flex}
  .fab:hover{border-color:var(--accent)}
  .fab .cnt{background:var(--accent);color:var(--on-accent);border-radius:10px;padding:1px 7px;font-size:11.5px;font-weight:650}

  .overlay{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(6px);z-index:70;display:none;align-items:center;justify-content:center}
  .overlay.show{display:flex}
  .ovcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 30px;text-align:center;max-width:340px;box-shadow:var(--shadow-ov)}
  .ovcard .sp1{width:40px;height:40px;margin:0 auto 14px;border-radius:50%;border:3px solid var(--card2);border-top-color:var(--accent);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ovcard .ot{font-weight:600;font-size:15px}
  .ovcard .os{color:var(--text3);font-size:12.5px;margin-top:6px}

  .toast{
    position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);
    background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 18px;
    font-size:13px;box-shadow:var(--shadow-toast);opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:88vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{border-color:var(--err);color:var(--err)}
  .toast.ok{border-color:var(--ok);color:var(--ok-fg)}

  @media (max-width:820px){
    .stats .chip:nth-child(4){display:none}

function t(k, p){
  const d = I18N[lang] || I18N.zh;
  let s = (k in d) ? d[k] : (I18N.zh[k] !== undefined ? I18N.zh[k] : k);
  if(p) for(const key in p) s = s.split('{'+key+'}').join(p[key]);
  return s;
}

  lang = (l==='en') ? 'en' : 'zh';

/* ---------------- 常量 ---------------- */
const AUDIO_IDS = new Set(['30216','30232','30280']);
const VIDEO_EXT = new Set(['mp4','mkv','flv','ts','webm','mov','avi','m4v','mpg','mpeg','wmv','f4v','ogv']);
const QN_LABEL = { 6:'240P', 16:'360P', 32:'480P', 64:'720P', 74:'720P60', 80:'1080P', 112:'1080P+', 116:'1080P60', 120:'4K', 125:'HDR', 126:'杜比', 127:'8K' };
const checkSvg = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

  filter: 'all', q: '', sort: 'title',

};

/* ---------------- 工具 ---------------- */
function fmtBytes(n){
  if(!n) return '0 B';
  const u=['B','KB','MB','GB','TB']; let i=0,v=n;
  while(v>=1024&&i<u.length-1){v/=1024;i++;}
  return (v>=100||i===0?v.toFixed(0):v.toFixed(1))+' '+u[i];
}
function fmtDur(s){
  s = Math.round(s||0); if(!s) return '';
  const h=Math.floor(s/3600), m=Math.floor(s%3600/60), sec=s%60;
  const p=n=>String(n).padStart(2,'0');
  return h ? `${h}:${p(m)}:${p(sec)}` : `${m}:${p(sec)}`;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
let toastT;
function toast(msg, type){
  const t = $('#toast'); t.textContent = msg;
  t.className = 'toast show' + (type==='err'?' err':type==='ok'?' ok':'');
  clearTimeout(toastT); toastT = setTimeout(()=>t.className='toast', 2800);
}
const uid = ()=> 'i'+(++state.seq)+'_'+Math.random().toString(36).slice(2,7);
function extOf(name){ const m=/\.([a-z0-9]+)$/i.exec(name); return m?m[1].toLowerCase():''; }
function stripExt(name){ return name.replace(/\.[^.]+$/,''); }
function sanitizeName(s){
  let x = String(s||'').replace(/\|/g,'｜').replace(/[\\/:*?"<>|\u0000-\u001f]/g,'_').replace(/\s+/g,' ').trim();
  x = x.replace(/^[.\s]+|[.\s]+$/g,'');
  if(x.length>110) x = x.slice(0,110).trim();
  return x || 'video';
}

/* ---------------- 引擎（状态指示已在界面上隐藏） ---------------- */
const CORE_PATH = new URL('vendor/ffmpeg-core.js', location.href).href;
function setEngine(st, txt){
  state.engineState = st;
  const el = document.getElementById('engine');
  if(el){
    el.className = 'engine' + (st==='ready'?' ready':st==='loading'?' loading':st==='error'?' err':'');
    const t = document.getElementById('engineTxt'); if(t) t.textContent = txt;
  }
}
let enginePromise = null;
async function ensureEngine(){
  if(state.ff && state.engineState==='ready') return state.ff;
  if(!enginePromise){
    enginePromise = (async ()=>{
      if(typeof FFmpeg === 'undefined') throw new Error(t('errEngineNotLoaded'));
      setEngine('loading','引擎加载中…');
      const ff = FFmpeg.createFFmpeg({ corePath: CORE_PATH, mainName:'main', log:false, logger:()=>{} });
      ff.setProgress(({ratio})=>{
        if(state.running && ratio>=0 && ratio<=1){
          state.running.progress = ratio;
          paintCard(state.running); paintDrawer();
        }
      });
      await ff.load();
      state.ff = ff;
      setEngine('ready','引擎已就绪');
      return ff;
    })().catch(e=>{ enginePromise = null; setEngine('error','引擎加载失败'); throw e; });
  }
  return enginePromise;
}
function resetEngine(){ enginePromise = null; state.ff = null; setEngine('idle','引擎待机'); }

// 单线程内核(@ffmpeg/core-st)在每次命令执行完毕后会调用 exit() 终止运行时，
// 之后必须重新创建模块实例才能继续执行下一条命令，否则会报
// "Program terminated with exit(0)" / "can only run one command at a time"。
async function recycleEngine(){
  const ff = state.ff;
  state.ff = null;
  enginePromise = null;
  setEngine('idle','引擎待机');
  if(ff){ try{ ff.exit(); }catch(_){} }
}

/* ---------------- 导入 ---------------- */
function isM4s(name){ return /\.m4s$/i.test(name); }
function isVideo(name){ return VIDEO_EXT.has(extOf(name)); }

async function ingestRecords(records){
  if(!records.length){ toast(t('toastNoVideo'), 'err'); return; }
  const groups = new Map();
  for(const r of records){
    const dir = r.path.includes('/') ? r.path.slice(0, r.path.lastIndexOf('/')) : '';
    if(!groups.has(dir)) groups.set(dir, []);
    groups.get(dir).push(r);
  }
  let added = 0, skipped = 0;

  for(const [dir, list] of groups){
    // 1) 元数据
    let meta = {};
    const info = list.find(x=>/^videoInfo\.json$/i.test(x.name));
    if(info){ try{ meta = JSON.parse(await (await info.getFile()).text()) || {}; }catch(_){ meta = {}; } }
    // 2) 封面：本地 image.jpg → group.jpg → 远端 coverUrl（升级为 https）
    let coverUrl = '';
    const coverRec = list.find(x=>/^image\.jpg$/i.test(x.name)) || list.find(x=>/^group\.jpg$/i.test(x.name));
    if(coverRec){ try{ coverUrl = URL.createObjectURL(await coverRec.getFile()); }catch(_){} }
    if(!coverUrl){
      const c = meta.coverUrl || meta.cover || meta.pic || '';
      if(/^https?:/i.test(c)) coverUrl = c.replace(/^http:/i,'https:');
    }
    const duration = Number(meta.duration) || 0;
    const qn = Number(meta.qn) || 0;
    const quality = qnLabel(qn);
    const uname = meta.uname || (meta.owner && meta.owner.name) || '';
    const bvid = meta.bvid || '';

    // 3) m4s 配对
    const m4s = list.filter(x=>isM4s(x.name));
    const byPrefix = new Map();
    for(const m of m4s){
      const mm = /^(.+)-(\d+)\.m4s$/i.exec(m.name);
      const prefix = mm ? mm[1] : stripExt(m.name);
      const id = mm ? mm[2] : '';
      if(!byPrefix.has(prefix)) byPrefix.set(prefix, {video:[], audio:[]});
      const g = byPrefix.get(prefix);
      (AUDIO_IDS.has(id) ? g.audio : g.video).push({rec:m, id});
    }
    for(const [prefix, g] of byPrefix){
      if(!g.video.length){ skipped++; continue; }
      const avc = g.video.filter(v=>/^30\d{3}$/.test(v.id));
      const pick = (avc.length?avc:g.video).sort((a,b)=>(+a.id||0)-(+b.id||0)).slice(-1)[0];
      const v = pick.rec;
      const a = g.audio.length ? g.audio.sort((x,y)=>(+x.id||0)-(+y.id||0)).slice(-1)[0].rec : null;
      state.items.push({
        id: uid(), kind:'dash', title: meta.title || prefix, uname, bvid,
        duration, qn, quality, coverUrl,
        vrec: v, arec: a,
        size:0, sizeText:'', status:'pending', progress:0, message:'', outName:'',
        originals: [v.del, a && a.del].filter(Boolean),
        deletable: !!(v.del && (!a || a.del)),
        hash: 'dash:'+dir+'/'+prefix,
      });
      added++;
    }
    // 4) 单个视频文件
    for(const r of list){
      if(isM4s(r.name)) continue;
      if(/^videoInfo\.json$/i.test(r.name)) continue;
      if(/^(image|group)\.jpg$/i.test(r.name)) continue;
      if(!isVideo(r.name)) continue;
      let size = 0;
      try{ size = (await r.getFile()).size; }catch(_){}
      state.items.push({
        id: uid(), kind:'single', title: meta.title || stripExt(r.name), uname, bvid,
        duration, quality: '', coverUrl,
        vrec: r, arec: null,
        size, sizeText: fmtBytes(size), status:'pending', progress:0, message:'', outName:'',
        originals: [r.del].filter(Boolean), deletable: !!r.del,
        hash: 'file:'+dir+'/'+r.name,
      });
      added++;
    }
  }
  if(added) toast(t('toastImported', { n: added }) + (skipped?t('toastSkipped', { n: skipped }):''), 'ok');
  else toast(t('toastNoVideo'), 'err');
  render(); updateDelUI();
  setTimeout(updateSizes, 30);
}

async function updateSizes(){
  let changed = false;
  for(const it of state.items){
    if(it.kind==='single' && it.size) continue;
    let s = 0;
    try{
      if(it.vrec) s += (await it.vrec.getFile()).size;
      if(it.arec) s += (await it.arec.getFile()).size;
    }catch(_){}
    it.size = s; it.sizeText = fmtBytes(s); changed = true;
  }
  if(changed){
    updateStats();
    for(const it of state.items){
      const el = document.querySelector('.card[data-id="'+it.id+'"] .meta .sub .s');
      if(el) el.textContent = it.sizeText;
    }
  }
}

/* ---------------- 采集器 ---------------- */
async function walkHandle(dirHandle, prefix, out){
  for await (const [name, handle] of dirHandle.entries()){
    if(name==='.DS_Store' || name.startsWith('.')) continue;
    if(handle.kind==='file'){
      out.push({ path: prefix+name, name, getFile: ()=>handle.getFile(), del:{ handle:dirHandle, name } });
    } else if(handle.kind==='directory'){
      await walkHandle(handle, prefix+name+'/', out);
    }
  }
}
async function walkEntry(entry, prefix, out){
  if(entry.isFile){
    if(entry.name==='.DS_Store' || entry.name.startsWith('.')) return;
    out.push({ path: prefix+entry.name, name: entry.name, getFile: ()=> new Promise((res,rej)=>entry.file(res,rej)), del:null });
  } else if(entry.isDirectory){
    const reader = entry.createReader(); const all = [];
    await new Promise((res)=>{
      const read = ()=> reader.readEntries(batch=>{
        if(!batch.length) return res();
        all.push(...batch); read();
      }, ()=>res());
      read();
    });
    for(const c of all) await walkEntry(c, prefix+entry.name+'/', out);
  }
}

function visibleItems(){
  let list = state.items.slice();
  if(state.filter==='pending') list = list.filter(i=>i.status!=='done');
  if(state.filter==='done') list = list.filter(i=>i.status==='done');
  const q = state.q.trim().toLowerCase();
  if(q) list = list.filter(i =>
    (i.title||'').toLowerCase().includes(q) ||
    (i.uname||'').toLowerCase().includes(q) ||
    (i.bvid||'').toLowerCase().includes(q));
  const s = state.sort;
  list.sort((a,b)=>{
    if(s==='size') return (b.size||0)-(a.size||0);
    if(s==='duration') return (b.duration||0)-(a.duration||0);
    return (a.title||'').localeCompare(b.title||'','zh');
  });
  return list;
}
function qnLabel(qn){ return qn===126 ? t('qnDolby') : (QN_LABEL[qn] || ''); }
function stateBadge(it){
  if(it.status==='running') return '<span class="badge state run">'+Math.round((it.progress||0)*100)+'%</span>';
  if(it.status==='done')     return '<span class="badge state done">'+t('badgeDone')+'</span>';
  if(it.status==='error')    return '<span class="badge state err">'+t('badgeError')+'</span>';
  if(it.status==='canceled') return '<span class="badge state canceled">'+t('badgeCanceled')+'</span>';
  if(state.queue.indexOf(it.id)>=0) return '<span class="badge state">'+t('badgeQueued')+'</span>';
  return '';
}
function cardHtml(it){
  const sel = state.sel.has(it.id);
  const running = it.status==='running';
  const hasState = it.status!=='pending';
  const qv = it.qn ? qnLabel(it.qn) : (it.quality || '');
  const q = qv ? '<span class="badge q">'+esc(qv)+'</span>' : '';
  const d = it.duration ? '<span class="badge dur">'+fmtDur(it.duration)+'</span>' : '';
  const tag = it.kind==='dash'
    ? '<span class="tag dash">'+t('kindDash')+'</span>'
    : '<span class="tag single">'+t('kindSingle')+'</span>';
  const pct = running ? Math.round((it.progress||0)*100) : 0;
  return '<div class="card '+(sel?'sel':'')+' '+(running?'running':'')+' '+(hasState?'hasstate':'')+'" data-id="'+it.id+'">'
    + '<div class="thumb">'
    +   '<div class="ph">'+t('noCover')+'</div>'
    +   (it.coverUrl ? '<img loading="lazy" src="'+esc(it.coverUrl)+'" alt="" onerror="this.remove()">' : '')
    +   q + d + stateBadge(it)
    +   '<div class="check">'+(sel?checkSvg:'')+'</div>'
    + '</div>'
    + '<div class="meta">'
    +   '<div class="title" title="'+esc(it.title)+'">'+esc(it.title)+'</div>'
    +   '<div class="tagwrap">'+tag+'</div>'
    +   '<div class="sub"><span class="u" title="'+esc(it.uname)+'">'+esc(it.uname||t('unknownUp'))+'</span><span class="s">'+(it.sizeText||'…')+'</span></div>'
    +   '<div class="pbar"><i style="width:'+pct+'%"></i></div>'
    + '</div>'
    + '</div>';
}

/* ---------------- 转换核心 ---------------- */
function mp4Offset(u8){
  const lim = Math.min(64, u8.length-4);
  for(let i=0;i<lim;i++){
    if(u8[i]===0x66&&u8[i+1]===0x74&&u8[i+2]===0x79&&u8[i+3]===0x70){ const s=i-4; return s>0?s:0; }
  }
  return 0;
}
async function readClean(rec){
  const f = await rec.getFile();
  const buf = new Uint8Array(await f.arrayBuffer());
  const off = mp4Offset(buf);
  return { data: off>0 ? buf.subarray(off) : buf, size: f.size };
}

async function startConvert(ids){
  if(state.running || state.queue.length){ toast(t('toastBusy')); return; }
  const targets = state.items.filter(i=> ids.indexOf(i.id)>=0 && i.status!=='done' && i.status!=='running');
  if(!targets.length){ toast(t('toastNoPending')); return; }
  showOverlay(t('ovTitle'), t('ovSub'));
  try{ await ensureEngine(); }
  catch(e){ hideOverlay(); toast(t('toastEngineFail', { msg: e.message }), 'err'); return; }
  hideOverlay();
  state.cancelFlag = false;
  targets.forEach(i=>{ i.status='pending'; i.progress=0; i.message=''; });
  state.queue = targets.map(i=>i.id);
  state.jobs = [];
  targets.forEach(i=> state.jobs.push({ videoId:i.id, title:i.title, status:'pending', progress:0, message:'', outName:'', duration:i.duration }));
  state.sel.clear();
  render(); openDrawer(); paintDrawer();
  pump();
}

async function pump(){
  if(state.cancelFlag){ finishRun(); return; }
  if(state.running) return;
  const id = state.queue.shift();
  if(!id){ finishRun(); return; }
  const it = state.items.find(x=>x.id===id);
  if(!it){ pump(); return; }
  state.running = it; it.status='running'; it.progress=0; it.message='';
  upsertJob(it); render(); paintDrawer();
  try{
    await convertOne(it);
    it.status='done'; it.progress=1; it.message='';
    if(state.deleteOriginals && it.deletable){ await deleteOriginals(it); }
  }catch(e){
    if(state.cancelFlag){ it.status='canceled'; it.message=t('msgCanceled'); }
    else { it.status='error'; it.message = (e && e.message) ? e.message : String(e); }
  }
  state.running = null;
  upsertJob(it); render(); paintDrawer();
  // 内核每次命令后会终止，回收后由下一轮 ensureEngine() 重新装载
  await recycleEngine();
  setTimeout(pump, 30);
}

function finishRun(){
  const canceled = state.cancelFlag;
  state.running = null; state.queue = []; state.cancelFlag = false;
  render(); paintDrawer();
  if(canceled) toast(t('toastAllCanceled'), 'err');
  else {
    const ok = state.items.filter(i=>i.status==='done').length;
    if(ok) toast(t('toastDone', { n: ok }), 'ok');
  }
}

async function convertOne(it){
  const ff = await ensureEngine();
  const tag = Math.random().toString(36).slice(2,8);
  const inV='iv_'+tag, inA='ia_'+tag, out='out_'+tag+'.mp4';
  const cleanup = [];
  try{
    const v = await readClean(it.vrec); cleanup.push(inV);
    if(v.size > 1.6*1024*1024*1024) throw new Error(t('errTooLarge'));
    ff.FS('writeFile', inV, v.data);
    let args;
    if(it.kind==='dash' && it.arec){
      const a = await readClean(it.arec); cleanup.push(inA);
      ff.FS('writeFile', inA, a.data);
      args = ['-i', inV, '-i', inA, '-map','0:v:0','-map','1:a:0','-c','copy','-movflags','+faststart', out];
    } else {
      args = ['-i', inV, '-map','0:v:0','-map','0:a?','-c','copy','-movflags','+faststart', out];
    }
    await ff.run.apply(ff, args);
    const data = ff.FS('readFile', out);
    if(!data || !data.length) throw new Error(t('errEmptyOutput'));
    const name = await uniqueOutName(it);
    await writeOut(name, data);
    it.outName = name;
    cleanup.push(out);
  } finally {
    for(const f of cleanup){ try{ ff.FS('unlink', f); }catch(_){} }
  }
}

function outBaseName(it){ return sanitizeName(it.title || 'video'); }

async function uniqueOutName(it){
  const base = outBaseName(it);
  let name = base + '.mp4';
  if(state.outDir){
    let i = 1;
    while(true){
      try{ await state.outDir.getFileHandle(name); name = base + ' (' + (++i) + ').mp4'; }
      catch(_){ break; }
    }
  }
  return name;
}
async function writeOut(name, data){
  if(state.outDir){
    const fh = await state.outDir.getFileHandle(name, { create:true });
    const w = await fh.createWritable();
    await w.write(new Blob([data], { type:'video/mp4' }));
    await w.close();
  } else {
    const url = URL.createObjectURL(new Blob([data], { type:'video/mp4' }));
    const a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 20000);
  }
}
async function deleteOriginals(it){
  for(const d of it.originals){
    try{ if(d && d.handle && d.handle.removeEntry) await d.handle.removeEntry(d.name); }
    catch(_){}
  }
}

/* ---------------- 抽屉 ---------------- */
function upsertJob(it){
  let j = state.jobs.find(x=>x.videoId===it.id);
  if(!j){ j = { videoId: it.id, title: it.title, status: it.status, progress: it.progress, message: it.message, outName: it.outName, duration: it.duration }; state.jobs.push(j); }
  j.status = it.status; j.progress = it.progress||0; j.message = it.message||''; j.outName = it.outName||''; j.title = it.title;
}
function paintDrawer(){
  const order = {running:0,error:1,canceled:2,pending:3,done:4};
  const arr = state.jobs.slice().sort((a,b)=> (order[a.status]??9)-(order[b.status]??9));
  const active = arr.filter(j=>j.status==='running').length;
  $('#fab').classList.toggle('show', arr.length>0);
  $('#fabCnt').textContent = active || arr.length;
  $('#jobList').innerHTML = arr.map(j=>{
    const pct = Math.round((j.progress||0)*100);
    const label = j.status==='done' ? t('jobDone') : j.status==='error' ? t('jobError') : j.status==='canceled' ? t('jobCanceled') : j.status==='running' ? (pct+'%') : t('jobWaiting');
    const cls = j.status==='done'?'done':j.status==='error'?'error':'';
    return '<div class="job '+cls+'">'
      + '<div class="jt">'+esc(j.title)+'</div>'
      + '<div class="jrow"><span>'+label+'</span><span>'+esc(j.status==='done'?(j.outName||''):(j.duration?fmtDur(j.duration):''))+'</span></div>'
      + '<div class="jbar"><i style="width:'+(j.status==='done'?100:pct)+'%"></i></div>'
      + (j.message?'<div class="jmsg">'+esc(j.message)+'</div>':'')
      + '</div>';
  }).join('') || '<div style="color:var(--text3);text-align:center;padding:40px 0">'+t('noTasks')+'</div>';
}
$('#fab').addEventListener('click', ()=> $('#drawer').classList.add('open'));
$('#btnCloseDrawer').addEventListener('click', ()=> $('#drawer').classList.remove('open'));
function openDrawer(){ $('#drawer').classList.add('open'); }

function hideOverlay(){ $('#overlay').classList.remove('show'); }

/* ---------------- 外观主题（跟随系统 / 浅色 / 深色） ----------------
   与宣传页共用 localStorage 的 vc2_theme，两页外观一致。
   html[data-theme-pref] 决定显示哪颗图标，html[data-theme] 是实际生效的令牌集。 */
const THEME_KEY = 'vc2_theme';
const THEME_CYCLE = ['auto','light','dark'];
function systemPrefersDark(){
  return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
}
let themePref = (()=>{
  try{ const s = localStorage.getItem(THEME_KEY); if(THEME_CYCLE.indexOf(s) >= 0) return s; }catch(_){}
  return 'auto';
})();
function applyTheme(pref, save){
  themePref = THEME_CYCLE.indexOf(pref) >= 0 ? pref : 'auto';
  const root = document.documentElement;
  const resolved = themePref === 'auto' ? (systemPrefersDark() ? 'dark' : 'light') : themePref;
  root.setAttribute('data-theme-pref', themePref);
  root.setAttribute('data-theme', resolved);
  root.style.colorScheme = resolved;
  if(save){ try{ localStorage.setItem(THEME_KEY, themePref); }catch(_){} }
  const btn = document.getElementById('btnTheme');
  if(btn){
    const label = themePref==='auto' ? t('themeAuto') : themePref==='light' ? t('themeLight') : t('themeDark');
    btn.title = label; btn.setAttribute('aria-label', label);
  }
}
function cycleTheme(){
  applyTheme(THEME_CYCLE[(THEME_CYCLE.indexOf(themePref) + 1) % THEME_CYCLE.length], true);
}
applyTheme(themePref, false);
$('#btnTheme').addEventListener('click', cycleTheme);
if(window.matchMedia){
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const onSys = ()=>{ if(themePref === 'auto') applyTheme('auto', false); };
  if(mq.addEventListener) mq.addEventListener('change', onSys);
  else if(mq.addListener) mq.addListener(onSys);
}
/* 切语言时刷新主题按钮的提示 */
const _applyI18nTheme = applyI18n;
applyI18n = function(){ _applyI18nTheme.apply(this, arguments); applyTheme(themePref, false); };

/* 预热引擎（不阻塞、不显示状态） */
if('requestIdleCallback' in window){
  requestIdleCallback(()=>{ ensureEngine().catch(()=>{}); }, { timeout: 4000 });
} else {
  setTimeout(()=>ensureEngine().catch(()=>{}), 2500);
}

applyI18n();
